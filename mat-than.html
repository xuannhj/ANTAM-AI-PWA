<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-[120px]">
<!-- TopAppBar -->
<!-- Main Content -->
<main class="flex-grow flex flex-col w-full max-w-3xl mx-auto px-container-padding gap-stack-gap pt-4">
<!-- Mode Selection Segmented Control -->
<section class="w-full pt-4">
<div aria-label="Chế độ quét" class="flex w-full rounded-2xl border-4 border-outline overflow-hidden bg-surface-container-low" role="group">
<button aria-pressed="true" class="flex-1 py-4 px-2 bg-primary text-on-primary font-label-xl text-label-xl whitespace-nowrap min-h-touch-target-min flex items-center justify-center transition-colors">
                    Quét Thuốc
                </button>
<button aria-pressed="false" class="flex-1 py-4 px-2 border-l-4 border-outline text-[#000000] font-bold text-label-xl whitespace-nowrap min-h-touch-target-min flex items-center justify-center hover:bg-surface-container-high transition-colors">
                    Đọc Tiền
                </button>
<button aria-pressed="false" class="flex-1 py-4 px-2 border-l-4 border-outline text-[#000000] font-bold text-label-xl whitespace-nowrap min-h-touch-target-min flex items-center justify-center hover:bg-surface-container-high transition-colors">
                    Đọc Hóa Đơn
                </button>
</div>
</section>
<!-- Camera Area -->
<section class="w-full flex-grow flex flex-col items-center justify-center min-h-[300px]">
<div class="relative w-full aspect-[4/3] max-h-[512px] bg-surface-container-highest rounded-2xl border-4 border-outline overflow-hidden flex items-center justify-center" data-alt="A POV shot from a mobile phone camera showing a slightly blurred, close-up view of a standard white pill bottle sitting on a wooden table. The lighting is bright and even, typical of a well-lit living room in light mode. The color palette focuses on neutral whites, warm wood tones, and subtle grey shadows. The overall aesthetic is functional and realistic, simulating what a user might see when trying to scan medication." style="background-color: #e2e2e2; background-image: linear-gradient(45deg, #eeeeee 25%, transparent 25%, transparent 75%, #eeeeee 75%, #eeeeee), linear-gradient(45deg, #eeeeee 25%, transparent 25%, transparent 75%, #eeeeee 75%, #eeeeee); background-size: 40px 40px; background-position: 0 0, 20px 20px;">
<!-- Flash Toggle Button -->
<button aria-label="Bật tắt đèn flash" class="absolute top-4 right-4 z-10 h-12 w-12 bg-[#ffffff]/80 backdrop-blur-sm rounded-full flex items-center justify-center border-2 border-outline hover:bg-[#ffffff] transition-colors active:scale-95 shadow-md">
<span class="material-symbols-outlined text-[28px] text-[#000000]">flash_on</span>
</button>
<!-- Focus Frame overlay -->
<div class="absolute inset-4 border-4 border-dashed border-primary/50 rounded-xl pointer-events-none"></div>
<!-- Scanning animation line -->
<div class="absolute top-0 left-0 right-0 h-1 bg-secondary shadow-[0_0_15px_#1b6d24] animate-[scan_2s_ease-in-out_infinite]"></div>
</div>
</section>
<!-- Action Button -->
<section class="w-full flex justify-center">
<button aria-label="QUÉT THUỐC / TIỀN" class="w-full md:w-3/4 min-h-[88px] bg-primary text-on-primary rounded-2xl border-4 border-primary flex items-center justify-center gap-4 hover:bg-on-primary-fixed active:scale-95 transition-transform shadow-lg">
<span aria-hidden="true" class="material-symbols-outlined text-[40px]">photo_camera</span>
<span class="font-headline-md text-headline-md">QUÉT THUỐC / TIỀN</span>
</button>
</section>
<!-- Results Area -->
<section class="w-full bg-surface-container-low rounded-2xl border-4 border-outline p-6 flex flex-col gap-6 relative">
<!-- Tonal Background for Result Text -->
<div class="bg-surface-container rounded-xl p-6 min-h-[120px] flex items-center justify-center text-center gap-4">
<span aria-hidden="true" class="material-symbols-outlined text-[48px] text-primary">volume_up</span>
<p aria-live="polite" class="font-headline-lg text-headline-lg text-[#000000] font-bold">
                    "Thuốc Paracetamol, uống sau khi ăn"
                </p>
</div>
<button aria-label="Đọc Lại" class="w-full min-h-touch-target-min bg-secondary-container text-on-secondary-container rounded-xl border-4 border-secondary flex items-center justify-center gap-4 hover:bg-secondary-fixed-dim active:scale-95 transition-transform">
<span aria-hidden="true" class="material-symbols-outlined text-[32px]">volume_up</span>
<span class="font-label-xl text-label-xl">Đọc Lại</span>
</button>
</section>
</main>

</a>

<span class="font-label-xl text-[16px] leading-tight font-bold">Khiên</span>
</a>

<span aria-hidden="true" class="material-symbols-outlined text-[32px] mb-1">mic</span>
<span class="font-label-xl text-[16px] leading-tight font-bold">Trợ Lý</span>
</a>
</nav>
