<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mắt Thần - AnTâm AI</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "outline": "#767683",
                "outline-variant": "#c6c5d4",
                "surface": "#f9f9f9",
                "primary": "#000666",
                "primary-container": "#1a237e",
                "on-primary": "#ffffff",
                "on-surface-variant": "#454652",
                "background": "#f9f9f9"
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pt-[100px] pb-[120px] flex flex-col">

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b-4 border-outline h-[80px] px-6 flex items-center justify-between shadow-sm">
  <a href="index.html" class="flex items-center gap-2 px-3 py-2 bg-primary text-white rounded-xl font-bold">
    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
    <span>Trang chủ</span>
  </a>
  <h1 class="text-[24px] font-black text-primary">Mắt Thần</h1>
  <div class="flex gap-2">
    <button class="p-2 text-primary"><span class="material-symbols-outlined text-[28px]">settings_accessibility</span></button>
    <button class="p-2 text-primary"><span class="material-symbols-outlined text-[28px]">record_voice_over</span></button>
  </div>
</header>

<main class="flex-grow max-w-3xl mx-auto w-full px-6 flex flex-col gap-6">
  <!-- Input ẩn để gọi Camera sau trên điện thoại -->
<input 
  type="file" 
  id="camera-input" 
  accept="image/*" 
  capture="environment" 
  class="hidden" 
/>
 <!-- MỚI: Thêm id, class btn-mode và data-mode -->
<div class="flex gap-2 justify-center my-4">
  <button id="btn-mode-medicine" class="btn-mode px-4 py-2 rounded-xl font-bold bg-primary text-white" data-mode="MEDICINE">💊 Đọc vỏ thuốc</button>
  <button id="btn-mode-receipt" class="btn-mode px-4 py-2 rounded-xl font-bold bg-surface-container-highest text-on-surface" data-mode="RECEIPT">🧾 Đọc hóa đơn</button>
  <button id="btn-mode-currency" class="btn-mode px-4 py-2 rounded-xl font-bold bg-surface-container-highest text-on-surface" data-mode="CURRENCY">💵 Nhận diện tiền</button>
</div>

  <!-- Camera Area -->
<!-- Nút chụp ảnh chính -->
<button id="btn-capture" class="w-full min-h-[72px] bg-primary text-white text-[22px] font-bold rounded-2xl border-4 border-primary flex items-center justify-center gap-3 shadow-lg hover:opacity-90 active:scale-95 transition-all">
  <span class="material-symbols-outlined text-[36px]">photo_camera</span>
  <span>CHỤP ẢNH / TẢI ẢNH</span>
</button>

<!-- Vùng hiển thị kết quả (Mặc định ẩn, chụp xong mới hiện) -->
<div id="preview-container" class="flex flex-col gap-4 hidden">
  <img id="image-preview" class="w-full max-h-[300px] object-contain rounded-xl border-2 border-outline bg-black/5" alt="Xem trước ảnh" />
  
  <!-- Thông báo trạng thái đang tải -->
  <div id="loading-spinner" class="p-4 bg-amber-50 border-2 border-amber-400 rounded-xl text-amber-900 font-bold text-center animate-pulse hidden">
    ⏳ Đang đọc thông tin từ ảnh, vui lòng chờ...
  </div>
  
  <!-- Khung in nội dung do Gemini trả về -->
 <!-- Khung kết quả chữ siêu to cho người cao tuổi -->
<div class="bg-white p-6 border-4 border-primary rounded-2xl shadow-lg mt-4">
  <div id="result-display" class="text-[28px] sm:text-[32px] font-black text-black leading-snug whitespace-pre-line tracking-wide"></div>
</div>
</main>

<!-- BottomNavBar (ACTIVE: Mắt Thần) -->
<nav class="fixed bottom-0 left-0 w-full z-50 h-[88px] bg-surface border-t-2 border-outline-variant shadow-lg flex justify-around items-center px-2">
  <a href="index.html" aria-label="Trang Chủ" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">home</span>
    <span class="text-[15px] font-bold leading-tight">Trang Chủ</span>
  </a>
  <a href="mat-than.html" aria-label="Mắt Thần" class="flex flex-col items-center justify-center bg-primary-container text-white rounded-2xl px-4 py-2 min-w-[76px] shadow-sm">
    <span class="material-symbols-outlined text-[28px] mb-1" style="font-variation-settings: 'FILL' 1;">visibility</span>
    <span class="text-[15px] font-bold leading-tight">Mắt Thần</span>
  </a>
  <a href="khien.html" aria-label="Khiên" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">verified_user</span>
    <span class="text-[15px] font-bold leading-tight">Khiên</span>
  </a>
  <a href="tro-ly.html" aria-label="Trợ Lý" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">mic</span>
    <span class="text-[15px] font-bold leading-tight">Trợ Lý</span>
  </a>
</nav>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
<script type="module" src="./js/app.js"></script>

</body>
</html>
