<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Trợ Lý &amp; SOS - AnTâm AI</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "primary": "#000666",
          "primary-container": "#1a237e",
          "on-primary": "#ffffff",
          "on-primary-container": "#8690ee",
          "secondary": "#1b6d24",
          "surface": "#f9f9f9",
          "surface-container-high": "#e8e8e8",
          "surface-container-highest": "#e2e2e2",
          "on-surface": "#1a1c1c",
          "on-surface-variant": "#454652",
          "outline": "#767683",
          "outline-variant": "#c6c5d4",
          "background": "#f9f9f9",
          "on-background": "#1a1c1c",
          "error": "#ba1a1a"
        },
        "spacing": {
          "container-padding": "20px",
          "stack-gap": "24px"
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
  @keyframes pulse-ring {
    0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4); }
    70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(255, 215, 0, 0); }
    100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(255, 215, 0, 0); }
  }
  .voice-pulse { animation: pulse-ring 2s infinite ease-in-out; }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col pt-[100px] pb-[120px]">

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b-4 border-outline h-[80px] px-container-padding flex items-center justify-between gap-2 shadow-sm">
  <div class="flex-1 flex justify-start items-center">
    <a href="index.html" aria-label="Quay lại Trang chủ" class="flex items-center gap-2 min-h-[48px] px-3.5 py-2 bg-primary text-on-primary hover:bg-primary-container rounded-xl border-2 border-primary transition-transform active:scale-95 shadow-md font-bold shrink-0">
      <span class="material-symbols-outlined text-[28px] shrink-0">arrow_back</span>
      <span class="text-[18px] sm:text-[20px] whitespace-nowrap leading-none">Trang chủ</span>
    </a>
  </div>
  <div class="flex-initial text-center px-2">
    <h1 class="text-[24px] font-black text-primary truncate">Trợ Lý AI</h1>
  </div>
  <div class="flex-1 flex justify-end items-center gap-2">
    <button class="p-2 text-primary rounded-full"><span class="material-symbols-outlined text-[30px]">settings_accessibility</span></button>
    <button class="p-2 text-primary rounded-full"><span class="material-symbols-outlined text-[30px]">record_voice_over</span></button>
  </div>
</header>

<!-- Main Content -->
<main class="flex-grow px-container-padding flex flex-col gap-stack-gap w-full max-w-4xl mx-auto">
  <section class="flex flex-col items-center mt-4">
    <button aria-label="GỌI CỨU HỘ KHẨN CẤP" class="w-full h-[320px] bg-error text-white rounded-[28px] flex flex-col items-center justify-center gap-4 border-4 border-red-800 shadow-xl">
      <span class="material-symbols-outlined text-[80px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
      <span class="text-[32px] font-black text-center uppercase leading-tight">GỌI CỨU HỘ<br/>KHẨN CẤP</span>
    </button>
  </section>

  <section class="bg-white border-4 border-outline rounded-2xl p-6 flex flex-col gap-4">
    <h2 class="text-[22px] font-bold text-on-surface border-b-4 border-outline pb-2">Người Thân</h2>
    <div class="flex items-center justify-between bg-surface p-4 rounded-xl border-2 border-outline-variant">
      <div>
        <div class="text-[18px] font-bold text-on-surface">Con Trai (Minh)</div>
        <div class="text-[14px] text-on-surface-variant">090 123 4567</div>
      </div>
      <button class="w-14 h-14 bg-primary text-on-primary rounded-xl flex items-center justify-center">
        <span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">call</span>
      </button>
    </div>
  </section>

  <section class="bg-primary-container rounded-3xl p-6 flex flex-col items-center text-center border-4 border-primary text-white">
    <h2 class="text-[22px] font-bold mb-4">Trợ Lý Đang Nghe...</h2>
    <div class="relative w-36 h-36 flex items-center justify-center mb-4">
      <div class="absolute inset-0 bg-[#FFD700] rounded-full voice-pulse opacity-50"></div>
      <div class="z-10 w-24 h-24 bg-[#FFD700] text-primary rounded-full flex items-center justify-center border-4 border-white shadow-lg">
        <span class="material-symbols-outlined text-[48px]" style="font-variation-settings: 'FILL' 1;">mic</span>
      </div>
    </div>
    <div class="w-full flex flex-col gap-2">
      <button class="w-full py-3 bg-white text-black font-bold text-[16px] rounded-xl">"Mở nhạc Trịnh"</button>
      <button class="w-full py-3 bg-white text-black font-bold text-[16px] rounded-xl">"Nhắc tôi uống thuốc"</button>
    </div>
  </section>
</main>

<!-- BottomNavBar (ACTIVE: Trợ Lý) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 py-2 bg-surface h-[88px] border-t-2 border-outline-variant shadow-lg">
  <a href="index.html" aria-label="Trang Chủ" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">home</span>
    <span class="text-[15px] font-bold text-[#000000]">Trang Chủ</span>
  </a>

  <a href="mat-than.html" aria-label="Mắt Thần" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">visibility</span>
    <span class="text-[15px] font-bold text-[#000000]">Mắt Thần</span>
  </a>

  <a href="khien.html" aria-label="Khiên" class="flex flex-col items-center justify-center text-on-surface-variant px-4 py-2 hover:bg-surface-container-highest rounded-xl transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">verified_user</span>
    <span class="text-[15px] font-bold text-[#000000]">Khiên</span>
  </a>

  <!-- Active Trợ lý -->
  <a href="tro-ly.html" aria-label="Trợ Lý" class="flex flex-col items-center justify-center bg-primary-container text-on-primary px-5 py-2.5 rounded-2xl shadow-md">
    <span class="material-symbols-outlined text-[28px] mb-1" style="font-variation-settings: 'FILL' 1;">mic</span>
    <span class="text-[15px] font-bold">Trợ Lý</span>
  </a>
</nav>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>
</body>
</html>
