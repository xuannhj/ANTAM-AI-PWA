<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1;
        }
        
        /* Pulse Animation for Voice Assistant */
        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4);
            }
            70% {
                transform: scale(1.1);
                box-shadow: 0 0 0 20px rgba(255, 215, 0, 0);
            }
            100% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
            }
        }
        
        .voice-pulse {
            animation: pulse-ring 2s infinite cubic-bezier(0.45, 0, 0.55, 1);
        }

        /* Waveform Animation */
        .wave-bar {
            animation: wave 1.2s ease-in-out infinite alternate;
        }
        .wave-bar:nth-child(1) { animation-delay: 0.1s; }
        .wave-bar:nth-child(2) { animation-delay: 0.3s; }
        .wave-bar:nth-child(3) { animation-delay: 0.5s; }
        .wave-bar:nth-child(4) { animation-delay: 0.7s; }
        .wave-bar:nth-child(5) { animation-delay: 0.9s; }
        
        @keyframes wave {
            0% { height: 10px; }
            100% { height: 60px; }
        }
    </style>
</head>
