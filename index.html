<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AnTâm AI - Trang Chủ</title>
<link rel="manifest" href="manifest.json"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "outline": "#767683",
                "secondary-container": "#a0f399",
                "on-primary-container": "#ffffff",
                "on-secondary": "#ffffff",
                "surface-container-lowest": "#ffffff",
                "surface": "#f9f9f9",
                "outline-variant": "#c6c5d4",
                "on-primary": "#ffffff",
                "primary-container": "#1a237e",
                "on-surface": "#1a1c1c",
                "secondary": "#1b6d24",
                "on-secondary-container": "#217128",
                "surface-container-high": "#e8e8e8",
                "primary": "#000666",
                "on-surface-variant": "#454652",
                "background": "#f9f9f9"
        },
        "spacing": {
                "container-padding": "20px",
                "section-margin": "40px",
                "stack-gap": "24px"
        }
      }
    }
  }
</script>
<style>
  .material-symbols-outlined {
    font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
  }
</style>
</head>
<body class="bg-background text-on-background min-h-screen pt-[80px] pb-[120px]">

<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 bg-surface border-b-4 border-outline flex justify-between items-center px-container-padding h-[80px]">
  <h1 class="text-[28px] font-black text-primary">AnTâm AI</h1>
  <div class="flex gap-2 items-center">
    <button aria-label="Cài đặt trợ năng" class="p-2 hover:bg-surface-container-high rounded-full">
      <span class="material-symbols-outlined text-primary text-[30px]">settings_accessibility</span>
    </button>
    <button aria-label="Giọng nói" class="p-2 hover:bg-surface-container-high rounded-full">
      <span class="material-symbols-outlined text-primary text-[30px]">record_voice_over</span>
    </button>
  </div>
</header>

<main class="px-container-padding max-w-4xl mx-auto flex flex-col gap-stack-gap">
  <section class="mt-[20px] bg-surface-container-lowest p-6 border-4 border-outline rounded-xl">
    <h2 class="text-[28px] font-bold text-primary">Chào Ông/Bà,</h2>
    <p class="text-[20px] font-bold text-black">Hôm nay thế nào?</p>
    <div class="flex items-center gap-6 bg-surface-container-high p-6 rounded-lg border-2 border-outline-variant mt-4">
      <span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'FILL' 1;">partly_cloudy_day</span>
      <div>
        <div class="text-[28px] font-bold">28°C - Nắng Nhẹ</div>
        <div class="text-[22px] font-bold text-black">Thứ Tư, 24 Tháng 5</div>
      </div>
    </div>
  </section>

  <section class="grid grid-cols-1 md:grid-cols-2 gap-stack-gap">
    <a href="mat-than.html" class="bg-primary-container text-white p-6 rounded-xl border-4 border-primary flex flex-col items-center justify-center gap-2 min-h-[180px]">
      <span class="material-symbols-outlined text-[56px]" style="font-variation-settings: 'FILL' 1;">visibility</span>
      <span class="text-[26px] font-bold">Mắt Thần</span>
      <span class="text-[18px] text-slate-200">Quét thuốc, nhận diện tiền</span>
    </a>

    <a href="khien.html" class="bg-secondary-container text-on-secondary-container p-6 rounded-xl border-4 border-secondary flex flex-col items-center justify-center gap-2 min-h-[180px]">
      <span class="material-symbols-outlined text-[56px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
      <span class="text-[26px] font-bold">Khiên</span>
      <span class="text-[18px] text-black font-semibold">Kiểm tra lừa đảo</span>
    </a>

    <a href="tro-ly.html" class="bg-surface-variant text-on-surface p-6 rounded-xl border-4 border-outline flex flex-col items-center justify-center gap-2 min-h-[180px]">
      <span class="material-symbols-outlined text-[56px] text-[#b8860b]" style="font-variation-settings: 'FILL' 1;">mic</span>
      <span class="text-[26px] font-bold">Trợ Lý</span>
      <span class="text-[18px] text-black font-semibold">Hỏi đáp, nhắc nhở</span>
    </a>

    <a href="tro-ly.html" class="bg-red-600 text-white p-6 rounded-xl border-4 border-red-800 flex flex-col items-center justify-center gap-2 min-h-[180px]">
      <span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">emergency</span>
      <span class="text-[36px] font-black uppercase">SOS</span>
    </a>
  </section>
</main>

<!-- BottomNavBar (ACTIVE: Trang Chủ) -->
<nav class="fixed bottom-0 left-0 w-full z-50 h-[88px] bg-surface border-t-2 border-outline-variant shadow-lg flex justify-around items-center px-2">
  <a href="index.html" aria-label="Trang Chủ" class="flex flex-col items-center justify-center bg-primary-container text-white rounded-2xl px-4 py-2 min-w-[76px] shadow-sm">
    <span class="material-symbols-outlined text-[28px] mb-1" style="font-variation-settings: 'FILL' 1;">home</span>
    <span class="text-[15px] font-bold leading-tight">Trang Chủ</span>
  </a>
  <a href="mat-than.html" aria-label="Mắt Thần" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">visibility</span>
    <span class="text-[15px] font-bold leading-tight">Mắt Thần</span>
  </a>
  <a href="khien.html" aria-label="Khiên" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">verified_user</span>
    <span class="text-[15px] font-bold leading-tight">Khiên</span>
  </a>
  <a href="tro-ly.html" aria-label="Trợ Lý" class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-highest rounded-2xl px-4 py-2 min-w-[76px] transition-colors">
    <span class="material-symbols-outlined text-[28px] mb-1">mic</span>
    <span class="text-[15px] font-bold leading-tight">Trợ Lý</span>
  </a>
</nav>

</body>
</html>
